name: rider_app
description: Pickrush rider app (UI only, hardcoded data).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.2
  geolocator: ^14.0.2
  audioplayers: ^6.7.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#E96C36"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash_logo.png
  color_dark: "#FFFFFF"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash_android12.png
    color_dark: "#FFFFFF"
    image_dark: assets/icon/splash_android12.png
  web: false
